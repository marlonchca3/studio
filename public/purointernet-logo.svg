<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="PuroInternet.com logo">
<defs>
 <radialGradient id="bg"><stop stop-color="#092449"/><stop offset=".7" stop-color="#041126"/><stop offset="1" stop-color="#010611"/></radialGradient>
